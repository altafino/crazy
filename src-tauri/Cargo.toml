[package]
name = "ai-app-studio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_app_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
toml_edit = "0.25.17"
thiserror = "2.0.21"
libc = "0.2.191"
regex = "1"
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1.54.1", features = ["process", "time", "macros", "rt-multi-thread", "sync", "io-util", "fs"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
tauri-plugin-notification = "2"
sha2 = "0.10.9"
tauri-plugin-single-instance = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ico = "0.6.0"
icns = "0.3"
base64 = "0.22"
resvg = "0.49.0"

# GTK's clipboard for files copied in a file manager (WebKitGTK hides them from the paste event).
# Same version Tauri already links, so nothing new is built.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
